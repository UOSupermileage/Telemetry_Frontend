server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The VM reverse proxy owns API forwarding. Never return SPA HTML for API calls.
    location = /api {
        return 404;
    }
    location ^~ /api/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
